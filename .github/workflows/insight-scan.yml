name: insight-scan

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 JST
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Ingest (fs_scan)
        run: python -m ingest.run_scan --producer fs_scan --target . --db insight.db

      - name: Run defect-detection rules
        run: python -m rules.run_checks --target . --db insight.db

      # continue-on-error here is deliberate: cli_adapter's exit code (0/1/2)
      # reflects DEFECT SEVERITY, not pipeline health. If this step were allowed
      # to fail the job directly, routine warn-level defects would be
      # indistinguishable from an actual broken pipeline below, spamming
      # insight-scan-failed issues (or keeping one permanently open) for
      # ordinary quality findings instead of real infrastructure problems.
      - name: CLI gate + manifest
        id: cli_gate
        continue-on-error: true
        run: |
          set +e
          python -m output.cli_adapter --db insight.db --fail-on warn --manifest-out report_manifest.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Generate offline static report
        if: always()
        run: python -m output.static_html_adapter --db insight.db --out-dir reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insight-report
          path: |
            report_manifest.json
            reports/

      # Optional: only runs when the INSIGHT_WEBHOOK_URL secret is set, and
      # never fails the job on notification errors (continue-on-error) — a
      # webhook outage shouldn't affect the quality gate or issue tracking.
      - name: Notify Slack/Teams webhook on fail-level defects
        if: ${{ secrets.INSIGHT_WEBHOOK_URL != '' }}
        continue-on-error: true
        run: |
          python -m output.webhook_notify --db insight.db --webhook-url "$INSIGHT_WEBHOOK_URL" --fail-on fail
        env:
          INSIGHT_WEBHOOK_URL: ${{ secrets.INSIGHT_WEBHOOK_URL }}

      # failure() here only reflects the checkout/setup/ingest/rules steps above
      # (continue-on-error steps are excluded from failure()/success() checks),
      # so this fires on real pipeline breakage, not on defects being found.
      - name: Create failure issue (if not already open)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label insight-scan-failed --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "insight-scan failed: $(date -u +%Y-%m-%d)" \
              --label insight-scan-failed \
              --body "The insight-scan workflow failed. See run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            echo "insight-scan-failed issue #$existing already open, skipping duplicate creation"
          fi

      - name: Close failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open_issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --label insight-scan-failed --state open --json number --jq '.[].number')
          for number in $open_issues; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "insight-scan succeeded again: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          done

      # Runs last, after the issue-tracking steps above have already judged
      # pipeline health, so it can safely fail the job for branch-protection /
      # status-check visibility without ever triggering the infra-failure issue.
      - name: Enforce quality gate
        run: exit ${{ steps.cli_gate.outputs.exit_code }}
