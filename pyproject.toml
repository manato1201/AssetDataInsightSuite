[project]
name = "asset-data-insight-suite"
version = "0.1.0"
description = "Unified ingestion -> defect detection -> trend analysis -> reporting pipeline for game asset data."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "ingest*", "rules*", "trend*", "output*", "webapp*"]
