"20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="1128.0" y="458.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 470.0) scale(1.000)"><path d="M5 5v30h30"/><path d="M10 27l7-9 6 5 9-14"/></g><rect class="card" x="1478.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1490.0 320.0) scale(1.000)"><path d="M14 11h22M14 20h22M14 29h22"/><circle class="fill" cx="7" cy="11" r="2"/><circle class="fill" cx="7" cy="20" r="2"/><circle class="fill" cx="7" cy="29" r="2"/></g><rect class="card" x="1478.0" y="508.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1490.0 520.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="608.0" y="848.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 860.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="868.0" y="848.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 860.0) scale(1.000)"><path d="M14 11h22M14 20h22M14 29h22"/><circle class="fill" cx="7" cy="11" r="2"/><circle class="fill" cx="7" cy="20" r="2"/><circle class="fill" cx="7" cy="29" r="2"/></g><rect class="card" x="1128.0" y="848.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 860.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><text class="title" x="150" y="242.0">.lqa サイドカー</text><text class="sub mono" x="150" y="261.0">producer: lqa</text><text class="title" x="150" y="392.0">ファイルシステム</text><text class="sub mono" x="150" y="411.0">producer: fs_scan</text><text class="title" x="150" y="542.0">Unity アセット</text><text class="sub mono" x="150" y="561.0">producer: unity_asset</text><text class="sub mono" x="150" y="576.0">(.meta・シーン・プレハブ)</text><text class="title" x="640" y="392.0">ingest/</text><text class="sub mono" x="640" y="411.0">SourceAdapter(Protocol)</text><text class="sub mono" x="640" y="426.0">@register のプラグイン</text><text class="title" x="900" y="392.0">insight.db</text><text class="sub mono" x="900" y="411.0">scan_runs・asset_records</text><text class="sub mono" x="900" y="426.0">check_results・defect_records</text><text class="title" x="1160" y="242.0">rules/</text><text class="sub mono" x="1160" y="261.0">YAML + evaluate()</text><text class="sub mono" x="1160" y="276.0">解消は再評価した所だけ</text><text class="title" x="1160" y="542.0">trend/</text><text class="sub mono" x="1160" y="561.0">外れ値(z・IQR)・分布</text><text class="sub mono" x="1160" y="576.0">前回との差・推移</text><text class="title" x="1510" y="392.0">report_manifest.json</text><text class="sub mono" x="1510" y="411.0">描画に依らない中間形式</text><text class="sub mono" x="1510" y="426.0">(型つきのセクション)</text><text class="title" x="1510" y="592.0">CLI・Excel・NDJSON</text><text class="sub mono" x="1510" y="611.0">静的 HTML・Webhook</text><text class="sub mono" x="1510" y="626.0">CI は終了コード 0 / 1 / 2</text><text class="title" x="640" y="932.0">スキャンの起動</text><text class="sub mono" x="640" y="951.0">別スレッドのジョブ</text><text class="sub mono" x="640" y="966.0">進みはポーリング</text><text class="title" x="900" y="932.0">不具合・推移</text><text class="sub mono" x="900" y="951.0">一覧・CSV・グラフ</text><text class="title" x="1160" y="932.0">ルールの編集</text><text class="sub mono" x="1160" y="951.0">YAML を保存</text><text class="sub mono" x="1160" y="966.0">(module は未検証)</text><rect class="lab" x="300.9" y="171.0" width="120.2" height="16" rx="3"/><text class="alabel mono blue" x="361.0" y="183.0">共通の形にそろえる</text><rect class="lab" x="752.8" y="321.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="770.0" y="333.0">追記</text><rect class="lab" x="1020.4" y="169.0" width="127.3" height="16" rx="3"/><text class="alabel mono blue" x="1084.0" y="181.0">読む / 不具合を書く</text><rect class="lab" x="1083.6" y="479.0" width="48.8" height="16" rx="3"/><text class="alabel mono blue" x="1108.0" y="491.0">SELECT</text><rect class="lab" x="1260.4" y="404.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="1296.0" y="416.0">集計の結果</text><rect class="lab" x="1578.8" y="429.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="1596.0" y="441.0">描画</text><text class="hd" x="40" y="44" text-anchor="start">AssetDataInsightSuite — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。唯一の真実の源は insight.db(SQLite)。取り込みだけが入力の種類を知っている</text><text class="note" x="500" y="722" text-anchor="start">テーブルは追記専用(defect_records だけ、不具合の状態を更新する)。失敗したスキャンも status=failed で残す</text></svg>
